<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Romantasy Match</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #16161a;
            --text-light: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #8b0000; /* Dark crimson */
            --accent-hover: #b90000;
            --save-color: #ff4b4b;
            --input-bg: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(139, 0, 0, 0.4);
        }

        .code-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .code-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid #3f3f46;
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--accent);
        }

        .load-btn {
            background: #3f3f46;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .load-btn:hover { background: #52525b; }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            max-height: 65vh;
            display: flex;
            flex-direction: column;
            position: relative;
            scrollbar-width: none; 
            border: 1px solid #27272a;
        }
        
        .card::-webkit-scrollbar { display: none; }

        .avatar-container {
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            border-bottom: 1px solid #27272a;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .quote-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            font-style: italic;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-size: 1.1rem;
            font-family: Georgia, serif;
            z-index: 10;
        }

        .profile-details {
            padding: 20px;
        }

        .name-age {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .location {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: #27272a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            border: 1px solid #3f3f46;
        }

        .bio-section { margin-bottom: 18px; }

        .bio-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .bio-text {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .bio-text strong { color: var(--text-light); }

        .profile-code {
            font-family: monospace;
            background: #000;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            word-break: break-all;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .action-container {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.96); }

        .generate-btn {
            background: linear-gradient(45deg, #4a0000, var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
            flex: 2;
        }
        .generate-btn:hover { filter: brightness(1.2); }

        .save-btn {
            background: #18181b;
            color: var(--save-color);
            border: 1px solid var(--save-color);
        }

        .saved-section {
            margin-top: 20px;
            width: 100%;
            display: none; 
        }

        .saved-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 10px;
            border-bottom: 1px solid #3f3f46;
            padding-bottom: 5px;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #27272a;
        }

        .saved-avatar {
            width: 60px;
            height: 60px;
            background: #18181b;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--accent);
        }

        .saved-info h4 { color: #fff; margin-bottom: 2px; }
        .saved-info p { font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">Midnight Match</div>
    
    <div class="code-tools">
        <input type="text" id="import-code" class="code-input" placeholder="Paste profile code here...">
        <button class="load-btn" onclick="loadProfile()">Load</button>
    </div>

    <div class="card" id="profile-card">
        <div class="avatar-container" id="avatar-render"></div>
        <div class="profile-details">
            <div class="name-age"><span id="p-name">Loading...</span>, <span id="p-age">500</span></div>
            <div class="location">📍 <span id="p-origin">The Shadows</span></div>
            
            <div class="tags-container" id="p-tags"></div>

            <div class="bio-section">
                <div class="bio-title">The Vibe</div>
                <div class="bio-text" id="p-vibe"></div>
            </div>
            <div class="bio-section">
                <div class="bio-title">Physical Stats</div>
                <div class="bio-text" id="p-physical"></div>
            </div>
            <div class="bio-section">
                <div class="bio-title">Acting Scene Specs</div>
                <div class="bio-text" id="p-scene"></div>
            </div>
            <div class="bio-section">
                <div class="bio-title">Equipment (Lucky Screwdriver)</div>
                <div class="bio-text" id="p-tool"></div>
            </div>
            <div class="bio-section">
                <div class="bio-title">Summoning Code</div>
                <div class="profile-code" id="p-code"></div>
            </div>
        </div>
    </div>

    <div class="action-container">
        <button class="btn generate-btn" onclick="generateProfile()">Summon Next</button>
        <button class="btn save-btn" onclick="saveProfile()">Favorite 🩸</button>
    </div>

    <div class="saved-section" id="saved-section">
        <div class="saved-title">Favored Souls</div>
        <div class="saved-list" id="saved-list"></div>
    </div>
</div>

<script>
    const data = {
        names: ["Cassian", "Rhysand", "Rowan", "Lorcan", "Xaden", "Liam", "Azriel", "Hunt", "Aidas", "Kingfisher", "Darius", "Fenrys", "Nyktos", "Casteel"],
        quotes: [
            "\"Who did this to you?\"",
            "\"I would burn this world to keep you warm.\"",
            "\"You are my ruin.\"",
            "\"Touch her and you die.\"",
            "\"Kneel.\"",
            "\"I have waited centuries for this.\"",
            "\"I'm the villain of this story, but I'm your villain.\""
        ],
        haircuts: ["Shoulder-length waves", "Undercut with messy top", "Strict military buzz", "Swept-back taper", "Man-bun with loose strands", "Shaggy wolf cut"],
        hairColors: [
            { name: "Midnight Black", hex: "#000000" }, { name: "Silver-white", hex: "#e8eaf6" },
            { name: "Ash Blonde", hex: "#c2b280" }, { name: "Blood Copper", hex: "#7a1717" },
            { name: "Dark Ash Brown", hex: "#3b2f2f" }, { name: "Raven Blue", hex: "#0f0f1b" }
        ],
        skinTones: [
            { name: "Pale moonlight", hex: "#f3e5db" }, { name: "Fair alabaster", hex: "#fcd6c3" },
            { name: "Sun-kissed olive", hex: "#c29b76" }, { name: "Warm bronze", hex: "#a66a41" },
            { name: "Rich mahogany", hex: "#4a2410" }, { name: "Deep obsidian", hex: "#221107" }
        ],
        ethnicities: [
            "Illyrian Descent", "Valg Bloodline", "Terrasen Highlands", 
            "Night Court Native", "Navarrian Aristocrat", "Shadow Realm Born"
        ],
        heights: ["5'11\"", "6'1\"", "6'3\"", "6'4\"", "6'6\"", "6'8\""],
        muscularity: ["Lean & corded like a whip", "Built like a brick wall", "Warrior-thick", "Sculpted like a dark god", "Broad-shouldered brawler"],
        bellySizes: ["V-taper lean", "Rugged lumberjack core", "Powerlifter thick", "Washboard abs"],
        necklines: ["Turtleneck", "Crewneck"],
        styles: [
            "Black tactical modern wear", "Fitted dark tee stretching across his chest", 
            "Tailored charcoal suit (no tie)", "Heavy leather jacket over a ripped Henley", 
            "Oversized black hoodie hiding his mass"
        ],
        toolLengths: ["5\"", "6\"", "6.5\"", "7\"", "7.5\"", "8\"", "8.5\"", "9\""],
        toolGirths: ["Precision-grip", "Heavy-duty", "Two-handed hilt", "Toolbox-bursting", "Crowbar-thick", "Wrist-thick"],
        hobbies: ["Blacksmithing", "Underground fight clubs", "Woodworking", "Brooding in the rain", "Drinking expensive whiskey", "Reading ancient tomes", "Axe throwing", "Motorcycle restoration"],
        occupations: ["Shadowsinger", "Security Consultant", "Billionaire CEO", "Bouncer", "Master Assassin", "Pilot", "Nightclub Owner"],
        hangouts: ["A hidden speakeasy", "High-rise penthouse", "The underground fighting ring", "A darkened library corner", "His private gym", "A smoky whiskey bar"],
        staminas: ["Couch potato (needs a nap after)", "Weekend warrior (good for a standard skirmish)", "Can go all night (and day)", "Fae-level elite endurance"],
        behaviors: [
            "Dominant and commanding", "Violently protective", 
            "Grumpy but touches you gently", "Smirking, teasing, and arrogant", 
            "Utterly devoted worshipper", "Cold to everyone else, golden retriever to you"
        ],
        desserts: ["Creampie", "Frosted cake", "Frosted Melons", "Feed just frosting"],
        frostingAmounts: ["Half a cup", "1 cup", "1.5 cups", "2 cups", "3 cups", "A gallon"],
        perksPool: ["Magic fingers", "Pierced tongue", "Calloused hands", "Veiny forearms", "Bulging biceps", "Steel triceps", "Iron glutes", "Pillar-like quads"]
    };

    let currentProfile = {}; 

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function generateProfileObj() {
        let h1 = randomItem(data.hobbies);
        let h2 = randomItem(data.hobbies);
        while(h1 === h2) h2 = randomItem(data.hobbies);
        
        let selectedPerks = [];
        let tempPool = [...data.perksPool];
        for(let i=0; i< (Math.floor(Math.random() * 3) + 1); i++) {
            selectedPerks.push(tempPool.splice(Math.floor(Math.random() * tempPool.length), 1)[0]);
        }

        return {
            name: randomItem(data.names),
            age: Math.floor(Math.random() * 800) + 25,
            quote: randomItem(data.quotes),
            origin: randomItem(data.ethnicities),
            hair: randomItem(data.hairColors),
            haircut: randomItem(data.haircuts),
            skin: randomItem(data.skinTones),
            height: randomItem(data.heights),
            muscle: randomItem(data.muscularity),
            belly: randomItem(data.bellySizes),
            neckline: randomItem(data.necklines),
            style: randomItem(data.styles),
            toolLength: randomItem(data.toolLengths),
            toolGirth: randomItem(data.toolGirths),
            dessert: randomItem(data.desserts),
            frosting: randomItem(data.frostingAmounts),
            h1: h1, h2: h2,
            occupation: randomItem(data.occupations),
            hangout: randomItem(data.hangouts),
            stamina: randomItem(data.staminas),
            performances: Math.floor(Math.random() * 10) + 1,
            behavior: randomItem(data.behaviors),
            perks: selectedPerks
        };
    }

    function renderProfile(profile) {
        currentProfile = profile;
        
        // Generate SVG graphic with stylized modern/romantasy blend
        const shirtColor = "#111"; // Dark modern clothes
        const neckShape = profile.neckline === "Turtleneck" 
            ? `<rect x="80" y="130" width="40" height="40" fill="${shirtColor}" />` // Turtleneck
            : `<path d="M 80 150 Q 100 170 120 150 Z" fill="${profile.skin.hex}" />`; // Crewneck skin showing

        currentProfile.svg = `
        <svg viewBox="0 0 200 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <!-- Broad angular shoulders -->
            <path d="M 10 250 L 30 170 L 170 170 L 190 250 Z" fill="${shirtColor}" />
            <!-- Neck -->
            <rect x="85" y="130" width="30" height="50" fill="${profile.skin.hex}" />
            <!-- Clothes Neckline override -->
            ${neckShape}
            <!-- Sharp jawline -->
            <path d="M 65 60 L 135 60 L 135 120 L 115 155 L 85 155 L 65 120 Z" fill="${profile.skin.hex}" />
            <circle cx="63" cy="110" r="8" fill="${profile.skin.hex}" />
            <circle cx="137" cy="110" r="8" fill="${profile.skin.hex}" />
            <!-- Stylized dark hair -->
            <path d="M 55 90 Q 100 20 145 90 Q 150 50 100 40 Q 50 50 55 90 Z" fill="${profile.hair.hex}" />
            <path d="M 50 70 Q 100 0 150 70 Q 120 30 80 30 Z" fill="${profile.hair.hex}" />
            <path d="M 70 40 L 90 90 L 75 90 Z" fill="${profile.hair.hex}" opacity="0.3"/>
        </svg>`;

        // Update DOM
        document.getElementById('p-name').innerText = profile.name;
        document.getElementById('p-age').innerText = profile.age;
        document.getElementById('p-origin').innerText = profile.origin;
        
        document.getElementById('avatar-render').innerHTML = `
            <div class="quote-overlay">${profile.quote}</div>
            ${currentProfile.svg}
        `;

        document.getElementById('p-tags').innerHTML = `
            <div class="tag">💼 ${profile.occupation}</div>
            <div class="tag">📏 ${profile.height}</div>
            <div class="tag">👕 ${profile.neckline}</div>
            <div class="tag">🎯 ${profile.h1}</div>
        `;

        document.getElementById('p-vibe').innerHTML = `
            <strong>Behavior:</strong> ${profile.behavior}<br>
            <strong>Style:</strong> ${profile.style}<br>
            <strong>Usually found at:</strong> ${profile.hangout}
        `;

        document.getElementById('p-physical').innerHTML = `
            ${profile.skin.name} skin, ${profile.hair.name.toLowerCase()} ${profile.haircut.toLowerCase()}.<br>
            ${profile.muscle} with a ${profile.belly.toLowerCase()}.<br>
            <strong>Standout Perks:</strong> ${profile.perks.join(', ')}.
        `;

        document.getElementById('p-scene').innerHTML = `
            <strong>Stamina:</strong> ${profile.stamina}<br>
            <strong>Performances per night:</strong> ${profile.performances}<br>
            <strong>Dessert Preference:</strong> ${profile.dessert} (${profile.frosting} of frosting)
        `;

        document.getElementById('p-tool').innerHTML = `
            Carries a ${profile.toolLength} ${profile.toolGirth.toLowerCase()} lucky screwdriver.
        `;

        // Generate base64 code for saving/sharing (without the SVG string to keep it short)
        const codeObj = { ...profile };
        delete codeObj.svg;
        const base64Code = btoa(encodeURIComponent(JSON.stringify(codeObj)));
        document.getElementById('p-code').innerText = base64Code;
        
        const saveBtn = document.querySelector('.save-btn');
        saveBtn.innerHTML = "Favorite 🩸";
        saveBtn.disabled = false;
        saveBtn.style.opacity = "1";
    }

    function generateProfile() {
        renderProfile(generateProfileObj());
    }

    function loadProfile() {
        const input = document.getElementById('import-code').value.trim();
        if (!input) return alert("Please paste a profile code first.");
        try {
            const decoded = JSON.parse(decodeURIComponent(atob(input)));
            if (decoded && decoded.name) {
                renderProfile(decoded);
                document.getElementById('import-code').value = ""; // clear input
            } else {
                alert("Invalid profile code.");
            }
        } catch (e) {
            alert("Failed to read profile code. Make sure you copied the whole block.");
        }
    }

    function saveProfile() {
        const savedSection = document.getElementById('saved-section');
        const savedList = document.getElementById('saved-list');
        const saveBtn = document.querySelector('.save-btn');

        savedSection.style.display = 'block';

        const card = document.createElement('div');
        card.className = 'saved-card';
        card.innerHTML = `
            <div class="saved-avatar">${currentProfile.svg}</div>
            <div class="saved-info">
                <h4>${currentProfile.name}, ${currentProfile.age}</h4>
                <p>💼 ${currentProfile.occupation}</p>
                <p>👕 ${currentProfile.neckline} | 📏 ${currentProfile.height}</p>
            </div>
        `;

        savedList.prepend(card);

        saveBtn.innerHTML = "Favored ✔️";
        saveBtn.disabled = true;
        saveBtn.style.opacity = "0.6";
        
        setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 150);
    }

    window.onload = generateProfile;
</script>

</body>
</html>
