<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizzlr | Smut Match</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161922;
            --card-inner: #1e2230;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #ff3366;
            --primary-gradient: linear-gradient(135deg, #ff3366 0%, #ff6b3d 100%);
            --like-color: #00e676;
            --pass-color: #ff5252;
            --super-color: #2979ff;
            --border-color: #272d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px 12px;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Dating App Nav */
        .app-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-icons {
            display: flex;
            gap: 12px;
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            max-height: 74vh;
            display: flex;
            flex-direction: column;
            position: relative;
            scrollbar-width: none;
            border: 1px solid var(--border-color);
        }

        .card::-webkit-scrollbar { display: none; }

        /* Photo Area */
        .avatar-container {
            width: 100%;
            height: 380px;
            background: radial-gradient(circle at 50% 30%, #2a2f42 0%, #11131a 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        /* Dating App Stories/Pagination Bars */
        .story-bars {
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 5px;
            z-index: 20;
        }

        .story-bar {
            height: 3px;
            flex: 1;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
        }

        .story-bar.active {
            background: #ffffff;
        }

        .match-badge {
            position: absolute;
            top: 24px;
            left: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #00e676;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 230, 118, 0.4);
            z-index: 10;
        }

        .quote-overlay {
            position: absolute;
            bottom: 14px;
            left: 14px;
            right: 14px;
            text-align: center;
            font-style: italic;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            font-size: 1.05rem;
            font-family: Georgia, serif;
            z-index: 10;
            line-height: 1.35;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #2979ff;
            color: white;
            border-radius: 50%;
            font-size: 11px;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* Profile Details */
        .profile-details {
            padding: 20px 18px 26px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .name-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .name-age {
            font-size: 1.9rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .location {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            background: var(--card-inner);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #e2e8f0;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .prompt-card {
            background: var(--card-inner);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
        }

        .prompt-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #ff6b81;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .prompt-text {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .prompt-text strong {
            color: var(--text-light);
        }

        /* Tinder-style Round Floating Action Bar */
        .action-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            padding: 4px 0 10px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid;
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        .btn-circle:active {
            transform: scale(0.9);
        }

        .btn-pass {
            border-color: var(--pass-color);
            color: var(--pass-color);
        }

        .btn-pass:hover {
            background: rgba(255, 82, 82, 0.12);
        }

        .btn-favorite {
            width: 70px;
            height: 70px;
            font-size: 1.9rem;
            border: none;
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.45);
        }

        .btn-favorite:hover {
            filter: brightness(1.15);
        }

        .btn-super {
            border-color: var(--super-color);
            color: var(--super-color);
        }

        .btn-super:hover {
            background: rgba(41, 121, 255, 0.12);
        }

        /* Saved Matches Accordion / Drawer */
        .saved-section {
            margin-top: 10px;
            width: 100%;
            display: none;
        }

        .saved-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .saved-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .saved-avatar {
            width: 52px;
            height: 52px;
            background: #111;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--primary);
        }

        .saved-info h4 {
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .saved-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.3;
        }
    </style>
</head>

    // SVG Generator with facial hair, hair cuts, and shirt styling
    function buildAvatarSVG(skinHex, hairHex, beardType, haircut, neckline) {
        const shirtColor = "#0f121a";

        // Neckline rendering
        let neckStyleMarkup = `<polygon points="78,140 122,140 100,165" fill="${skinHex}" />`;
        if (neckline === "Turtleneck") {
            neckStyleMarkup = `<rect x="76" y="130" width="48" height="35" rx="6" fill="${shirtColor}" stroke="#1f2433" stroke-width="2" />`;

            toolGirth: randomItem(data.toolGirths),
            cream: randomItem(data.creams),
            frosting: randomItem(data.frostingAmounts),
            direction: randomItem(data.directions),
            h1: h1, 
            h2: h2,
            occupation: randomItem(data.occupations),
            hangout: randomItem(data.hangouts),
            stamina: randomItem(data.staminas),
            // Randomized 1-8 performances per night
            performances: Math.floor(Math.random() * 8) + 1,
            behavior: randomItem(data.behaviors),
            perks: selectedPerks,
            svg: buildAvatarSVG(skin.hex, hair.hex, beard, haircut, neckline)
        };
    }

    function renderProfile(profile) {
        currentProfile = profile;

        document.getElementById('p-name').innerText = profile.name;
        document.getElementById('p-age').innerText = profile.age;
        document.getElementById('p-origin').innerText = profile.origin;
        document.getElementById('p-distance').innerText = `${profile.distance} miles away`;

        document.getElementById('avatar-render').innerHTML = `
            <div class="story-bars">
                <div class="story-bar active"></div>
                <div class="story-bar"></div>
                <div class="story-bar"></div>
            </div>
            <div class="match-badge">98% COMPATIBLE</div>
            <div class="quote-overlay">${profile.quote}</div>
            ${profile.svg}
        `;

        document.getElementById('p-tags').innerHTML = `
            <div class="tag">💼 ${profile.occupation}</div>
            <div class="tag">📏 ${profile.height}</div>
            <div class="tag">🧔 ${profile.beard}</div>
            <div class="tag">🎯 ${profile.h1}</div>
            <div class="tag">⚡ ${profile.h2}</div>
        `;

        document.getElementById('p-vibe').innerHTML = `
            <strong>Dating Archetype:</strong> ${profile.behavior}.<br>
            <strong>Wardrobe:</strong> ${profile.style}.<br>
            <strong>How you two cross paths:</strong> Locked eyes ${profile.meetLocation}.<br>
            <strong>Off-duty spot:</strong> ${profile.hangout}.
        `;

        document.getElementById('p-physical').innerHTML = `
            ${profile.skin.name} complexion with ${profile.hair.name.toLowerCase()} (${profile.haircut.toLowerCase()}).<br>
            ${profile.beard}.<br>
            ${profile.muscle}, rocking a ${profile.belly.toLowerCase()}.<br>
            <strong>Hallmark Features:</strong> ${profile.perks.join(', ')}.
        `;

        document.getElementById('p-scene').innerHTML = `
            <strong>Stamina Rating:</strong> ${profile.stamina}<br>
            <strong>Performances per night:</strong> ${profile.performances} round${profile.performances > 1 ? 's' : ''} guaranteed<br>
            <strong>Favorite Angle:</strong> Taking you ${profile.direction}<br>
            <strong>Finishing style:</strong> ${profile.cream} (${profile.frosting} load)
        `;

        document.getElementById('p-tool').innerHTML = `
            Packing a ${profile.toolLength} long, ${profile.toolGirth.toLowerCase()} lucky screwdriver.
        `;

        const likeBtn = document.getElementById('like-btn');
        likeBtn.innerHTML = "❤️";
        likeBtn.disabled = false;
        likeBtn.style.opacity = "1";
    }

    function generateProfile() {
        renderProfile(generateProfileObj());
        const card = document.getElementById('profile-card');
        card.scrollTop = 0;
    }

    function saveProfile() {
        const savedSection = document.getElementById('saved-section');
        const savedList = document.getElementById('saved-list');
        const countSpan = document.getElementById('saved-count');
        const likeBtn = document.getElementById('like-btn');

        savedProfiles.unshift(currentProfile);
        savedSection.style.display = 'block';

        const card = document.createElement('div');
        card.className = 'saved-card';
        card.innerHTML = `
            <div class="saved-avatar">${currentProfile.svg}</div>
            <div class="saved-info">
                <h4>${currentProfile.name}, ${currentProfile.age}</h4>
                <p>💼 ${currentProfile.occupation} • 📏 ${currentProfile.height}</p>
                <p>🧔 ${currentProfile.beard}</p>
            </div>
        `;

        savedList.prepend(card);
        countSpan.innerText = savedProfiles.length;

        likeBtn.innerHTML = "🔥";
        likeBtn.disabled = true;
        likeBtn.style.opacity = "0.7";

        setTimeout(() => {
            generateProfile();
        }, 350);
    }

    function superLike() {
        const card = document.getElementById('profile-card');
        card.style.transition = "transform 0.3s ease";
        card.style.transform = "scale(1.03) translateY(-10px)";
        setTimeout(() => {
            card.style.transform = "none";
            saveProfile();
        }, 200);
    }

    window.onload = generateProfile;
</script>

</body>
</html>
